[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-rollmatch"
version = "0.1.0"
description = "Fast rolling entry matching for staggered adoption — Python reimplementation of R rollmatch"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Alan Huang" },
]
keywords = [
    "causal-inference",
    "matching",
    "propensity-score",
    "rolling-entry",
    "staggered-adoption",
    "difference-in-differences",
    "treatment-effects",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "polars>=1.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-xdist",
]

[tool.hatch.build.targets.wheel]
packages = ["src/py_rollmatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
